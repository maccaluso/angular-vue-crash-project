<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-title">{{ title }}</h1>
    <!-- routerLink è l'equivalente di router-link in Vue Router.
         routerLinkActive aggiunge la classe indicata quando la rotta è
         attiva — equivalente ad active-class su router-link in Vue.
         Con CSS nostro (non generato da un compilatore di utility) non
         serve più il workaround visto con Tailwind: basta una singola
         classe "is-active", perché controlliamo noi l'ordine delle
         regole in shared.styles/app.ts. -->
    <nav class="app-nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link"
        >Lista task</a
      >
      <a routerLink="/new" routerLinkActive="is-active" class="nav-link">Nuovo task</a>
      <a routerLink="/login" routerLinkActive="is-active" class="nav-link">Login</a>
      <a routerLink="/search" routerLinkActive="is-active" class="nav-link">Cerca (RxJS)</a>
    </nav>
  </div>
</header>

<main class="app-main">
  <!-- router-outlet: identico concettualmente a <router-view /> in Vue -->
  <router-outlet></router-outlet>
</main>
