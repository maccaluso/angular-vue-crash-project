@if (task(); as t) {
  <!-- "@if (expr; as t)" salva il risultato non-null in una variabile di
       template locale "t": evita di richiamare task() più volte e
       gestisce da solo il caso undefined. -->
  <div class="detail-card">
    <h2 class="page-title">{{ t.title }}</h2>
    <p class="summary">
      Stato:
      <span class="status-badge" [class.is-done]="t.completed">{{
        t.completed ? 'completato' : 'da fare'
      }}</span>
    </p>
    <div class="detail-card__actions">
      <button type="button" (click)="toggle()" class="btn btn--primary">
        {{ t.completed ? 'Segna come da fare' : 'Segna come completato' }}
      </button>
      <button type="button" (click)="remove()" class="btn btn--danger-ghost">Elimina</button>
    </div>
  </div>
} @else {
  <p class="hint">Task non trovato (id: {{ id() }}).</p>
}
