<h2 class="text-xl font-semibold text-slate-900">Nuovo task</h2>

<form (submit)="onSubmit($event)" class="mt-4 max-w-sm">
  <div>
    <label for="title" class="block text-sm font-medium text-slate-700">Titolo</label>
    <!-- [formField] collega questo input al campo "title" del signal
         form: legge il valore, scrive gli aggiornamenti, e traccia
         automaticamente touched/dirty per mostrare gli errori solo
         quando ha senso (dopo che l'utente ha interagito col campo). -->
    <input
      id="title"
      type="text"
      [formField]="taskForm.title"
      class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
    />

    @if (taskForm.title().touched() && taskForm.title().invalid()) {
      @for (error of taskForm.title().errors(); track error.message) {
        <p class="error mt-1 text-sm text-red-600">{{ error.message }}</p>
      }
    }
  </div>

  <button
    type="submit"
    [disabled]="taskForm().invalid()"
    class="mt-4 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-700 disabled:cursor-not-allowed disabled:bg-slate-300"
  >
    Crea task
  </button>
</form>
