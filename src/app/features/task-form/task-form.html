<h2 class="page-title">Nuovo task</h2>

<form (submit)="onSubmit($event)" class="form">
  <div class="field">
    <label for="title">Titolo</label>
    <!-- [formField] collega questo input al campo "title" del signal
         form: legge il valore, scrive gli aggiornamenti, e traccia
         automaticamente touched/dirty per mostrare gli errori solo
         quando ha senso (dopo che l'utente ha interagito col campo). -->
    <input id="title" type="text" [formField]="taskForm.title" />

    @if (taskForm.title().touched() && taskForm.title().invalid()) {
      @for (error of taskForm.title().errors(); track error.message) {
        <p class="error">{{ error.message }}</p>
      }
    }
  </div>

  <button type="submit" [disabled]="taskForm().invalid()" class="btn btn--primary">Crea task</button>
</form>
