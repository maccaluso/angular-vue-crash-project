<!-- [class.xxx] è il binding di classe condizionale, identico nello
     spirito a :class="{ xxx: cond }" in Vue. -->
<div class="task-row" [class.is-done]="task().completed">
  <input
    type="checkbox"
    [checked]="task().completed"
    (change)="toggle()"
    class="task-row__checkbox"
  />
  <a
    [routerLink]="['/tasks', task().id]"
    class="task-row__link"
    [class.is-done]="task().completed"
  >
    <span>{{ task().title }}</span>
  </a>
  <button type="button" (click)="remove()" class="btn btn--sm btn--danger-ghost">Elimina</button>
</div>
