<h2 class="page-title">Login</h2>

<!-- @if è il nuovo control flow: sostituisce *ngIf. Sintassi nativa nel
     template, niente più asterisco/direttiva strutturale. -->
@if (authService.isLoggedIn()) {
  <p class="hint">Sei già loggato ✅. Puoi andare su "Nuovo task".</p>
  <button type="button" (click)="logout()" class="btn btn--secondary">
    Logout
  </button>
} @else {
  <p class="hint">Non sei loggato. La rotta "Nuovo task" è protetta da un guard funzionale.</p>
  <button type="button" (click)="login()" class="btn btn--primary">
    Login (finto, un solo click)
  </button>
}
