<h2 class="text-xl font-semibold text-slate-900">Login</h2>

<!-- @if è il nuovo control flow: sostituisce *ngIf. Sintassi nativa nel
     template, niente più asterisco/direttiva strutturale. -->
@if (authService.isLoggedIn()) {
  <p class="mt-3 text-sm text-slate-600">Sei già loggato ✅. Puoi andare su "Nuovo task".</p>
  <button
    type="button"
    (click)="logout()"
    class="mt-4 rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50"
  >
    Logout
  </button>
} @else {
  <p class="mt-3 text-sm text-slate-600">
    Non sei loggato. La rotta "Nuovo task" è protetta da un guard funzionale.
  </p>
  <button
    type="button"
    (click)="login()"
    class="mt-4 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-700"
  >
    Login (finto, un solo click)
  </button>
}
